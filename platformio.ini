; SPDX-License-Identifier: MIT
;
; awsmSIM-Empfänger: Graupner HoTT (SUMD) -> ESP32 -> Bluetooth-Gamepad.
; Bauen und aufspielen:  pio run -e esp32dev -t upload
; Serieller Monitor:     pio device monitor -e esp32dev

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; NimBLE 1.4.3 zuerst, sonst zieht die Gamepad-Bibliothek eine zweite NimBLE-Version nach.
; Diese Kombination ist mit MZ-18, HoTT-Empfänger (SUMD an Buchse 6) und Android-Chrome erprobt.
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
  lemmingdev/ESP32-BLE-Gamepad@0.5.4
build_flags =
  -Wall
test_ignore = *
