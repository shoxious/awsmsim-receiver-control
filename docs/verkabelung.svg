<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" width="860" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Verkabelung GR-12 zu ESP32 / Wiring GR-12 to ESP32</title>
  <rect width="860" height="420" fill="#ffffff"/>

  <!-- Empfänger -->
  <rect x="40" y="90" width="230" height="240" rx="10" fill="#f2f4f7" stroke="#344054" stroke-width="2"/>
  <text x="155" y="122" text-anchor="middle" font-size="18" font-weight="700" fill="#101828">HoTT-Empfänger</text>
  <text x="155" y="144" text-anchor="middle" font-size="14" fill="#475467">GR-12 / GR-12L</text>
  <text x="155" y="176" text-anchor="middle" font-size="13" fill="#475467">Servobuchse 6</text>
  <text x="155" y="194" text-anchor="middle" font-size="13" fill="#475467">„SUMD at CH6: YES“</text>
  <!-- Pins -->
  <g font-size="15" font-weight="700">
    <rect x="232" y="225" width="26" height="26" rx="4" fill="#ffffff" stroke="#344054"/><text x="245" y="243" text-anchor="middle" fill="#101828">6</text>
    <rect x="232" y="260" width="26" height="26" rx="4" fill="#ffffff" stroke="#344054"/><text x="245" y="279" text-anchor="middle" fill="#101828">+</text>
    <rect x="232" y="295" width="26" height="26" rx="4" fill="#ffffff" stroke="#344054"/><text x="245" y="313" text-anchor="middle" fill="#101828">−</text>
  </g>
  <g font-size="12" fill="#475467" text-anchor="end">
    <text x="224" y="242">Signal (SUMD)</text>
    <text x="224" y="277">Plus</text>
    <text x="224" y="312">Minus</text>
  </g>

  <!-- ESP32 -->
  <rect x="590" y="70" width="230" height="290" rx="10" fill="#eef4ff" stroke="#344054" stroke-width="2"/>
  <text x="705" y="102" text-anchor="middle" font-size="18" font-weight="700" fill="#101828">ESP32-DevKit</text>
  <text x="705" y="124" text-anchor="middle" font-size="14" fill="#475467">(klassischer ESP32)</text>
  <rect x="660" y="318" width="90" height="30" rx="5" fill="#ffffff" stroke="#344054"/>
  <text x="705" y="338" text-anchor="middle" font-size="13" fill="#101828">USB</text>
  <g font-size="14" font-weight="700" fill="#101828">
    <rect x="600" y="225" width="96" height="26" rx="4" fill="#ffffff" stroke="#344054"/><text x="648" y="243" text-anchor="middle">GPIO16</text>
    <rect x="600" y="260" width="96" height="26" rx="4" fill="#ffffff" stroke="#344054"/><text x="648" y="278" text-anchor="middle">VIN / 5V</text>
    <rect x="600" y="295" width="96" height="26" rx="4" fill="#ffffff" stroke="#344054"/><text x="648" y="313" text-anchor="middle">GND</text>
  </g>
  <g font-size="12" fill="#475467">
    <text x="704" y="242">„RX2“ oder „16“</text>
    <text x="704" y="277">nicht 3V3!</text>
  </g>

  <!-- Leitungen -->
  <line x1="258" y1="238" x2="385" y2="238" stroke="#f79009" stroke-width="4"/>
  <rect x="385" y="226" width="70" height="24" rx="3" fill="#fef0c7" stroke="#b54708" stroke-width="2"/>
  <text x="420" y="243" text-anchor="middle" font-size="13" font-weight="700" fill="#7a2e0e">1 kΩ</text>
  <line x1="455" y1="238" x2="600" y2="238" stroke="#f79009" stroke-width="4"/>
  <line x1="258" y1="273" x2="600" y2="273" stroke="#d92d20" stroke-width="4"/>
  <line x1="258" y1="308" x2="600" y2="308" stroke="#6b4e3d" stroke-width="4"/>
  <g font-size="12" fill="#475467" text-anchor="middle">
    <text x="420" y="218">orange</text>
    <text x="420" y="266">rot</text>
    <text x="420" y="301">braun / schwarz</text>
  </g>

  <text x="430" y="44" text-anchor="middle" font-size="20" font-weight="700" fill="#101828">Verkabelung · Wiring</text>
  <text x="430" y="395" text-anchor="middle" font-size="13" fill="#475467">Vor dem Anschließen von GPIO16: Pegel an Buchse 6 messen, höchstens 3,3 V · Measure socket 6 first: max. 3.3 V</text>
</svg>
